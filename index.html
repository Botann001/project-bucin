<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you want to be my valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="questionContainer">
        <img src="pinching-cheeks-bubu-angry.gif" alt="Bubu Dudu" class="main-gif">
        <h2>Do you want to be my valentine? 💕</h2>
        <div class="button-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="container" id="heartLoader" style="display: none;">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>

    <div class="container" id="resultContainer" style="display: none;">
        <img src="bubu-dudu-sseeyall.gif" alt="Bubu Dudu" class="main-gif">
        <h2>Yippee! 🥰</h2>
    </div>

    <script src="script.js"></script>
    <script>
      // Fallback inline script jika browser meng-cache file script.js lama
      (function() {
        const questionContainer = document.getElementById("questionContainer");
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const heartLoader = document.getElementById("heartLoader");
        const resultContainer = document.getElementById("resultContainer");
        const gifResult = document.getElementById("gifResult");

        let isAbsolute = false;
        let yesScale = 1;

        const moveNoButton = (e) => {
          if (e && e.type === "touchstart") {
            e.preventDefault();
          }

          if (!isAbsolute) {
            noBtn.style.position = "absolute";
            noBtn.style.zIndex = "10";
            isAbsolute = true;
          }

          const containerWidth = questionContainer.clientWidth;
          const containerHeight = questionContainer.clientHeight;
          const btnWidth = noBtn.offsetWidth;
          const btnHeight = noBtn.offsetHeight;

          const padding = 16;
          const minX = padding;
          const maxX = Math.max(minX, containerWidth - btnWidth - padding);
          const minY = padding;
          const maxY = Math.max(minY, containerHeight - btnHeight - padding);

          const curX = noBtn.offsetLeft;
          const curY = noBtn.offsetTop;

          let newX = minX;
          let newY = minY;
          let attempts = 0;

          do {
            newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
            attempts++;
          } while (
            attempts < 15 &&
            Math.hypot(newX - curX, newY - curY) < 70
          );

          noBtn.style.left = `${newX}px`;
          noBtn.style.top = `${newY}px`;

          if (yesScale < 1.6) {
            yesScale += 0.08;
            yesBtn.style.transform = `scale(${yesScale})`;
          }
        };

        // Hapus listener lama jika ada dan pasang handler baru
        noBtn.onmouseover = moveNoButton;
        noBtn.onmouseenter = moveNoButton;
        noBtn.ontouchstart = (e) => { e.preventDefault(); moveNoButton(e); };
        noBtn.onclick = (e) => { e.preventDefault(); moveNoButton(e); };

        yesBtn.onclick = () => {
          questionContainer.style.display = "none";
          heartLoader.style.display = "flex";

          setTimeout(() => {
            heartLoader.style.display = "none";
            resultContainer.style.display = "flex";

            if (gifResult && typeof gifResult.play === "function") {
              gifResult.play();
            }
          }, 2000);
        };
      })();
    </script>
</body>
</html>
