<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you want to be my valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="questionContainer">
        <img src="pinching-cheeks-bubu-angry.gif" alt="Bubu Dudu" class="main-gif">
        <h2>Do you want to be my valentine? 💕</h2>
        <div class="button-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="container" id="heartLoader" style="display: none;">
        <div class="loader"></div>
        <p>Loading...</p>
    </div>

    <div class="container" id="resultContainer" style="display: none;">
        <img src="bubu-dudu-sseeyall.gif" alt="Bubu Dudu" class="main-gif">
        <h2>Yippee! 🥰</h2>
    </div>

    <script src="script.js"></script>
    <script>
      (function() {
        const questionContainer = document.getElementById("questionContainer");
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const heartLoader = document.getElementById("heartLoader");
        const resultContainer = document.getElementById("resultContainer");
        const gifResult = document.getElementById("gifResult");

        let isFixed = false;
        let yesScale = 1;

        const moveNoButton = (e) => {
          if (e && e.type === "touchstart") {
            e.preventDefault();
          }

          const btnWidth = noBtn.offsetWidth;
          const btnHeight = noBtn.offsetHeight;
          const curRect = noBtn.getBoundingClientRect();

          if (!isFixed) {
            noBtn.style.position = "fixed";
            noBtn.style.left = `${curRect.left}px`;
            noBtn.style.top = `${curRect.top}px`;
            noBtn.style.zIndex = "9999";
            isFixed = true;
          }

          const margin = 24;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          const minX = margin;
          const maxX = Math.max(minX, screenWidth - btnWidth - margin);
          const minY = margin;
          const maxY = Math.max(minY, screenHeight - btnHeight - margin);

          const yesRect = yesBtn.getBoundingClientRect();
          const overlapsYes = (x, y) => {
            return (
              x < yesRect.right + 25 &&
              x + btnWidth > yesRect.left - 25 &&
              y < yesRect.bottom + 25 &&
              y + btnHeight > yesRect.top - 25
            );
          };

          let newX = minX;
          let newY = minY;
          let attempts = 0;

          do {
            newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
            attempts++;
          } while (
            attempts < 25 &&
            (Math.hypot(newX - curRect.left, newY - curRect.top) < 160 || overlapsYes(newX, newY))
          );

          noBtn.style.left = `${newX}px`;
          noBtn.style.top = `${newY}px`;

          if (yesScale < 1.8) {
            yesScale += 0.08;
            yesBtn.style.transform = `scale(${yesScale})`;
          }
        };

        noBtn.onmouseover = moveNoButton;
        noBtn.onmouseenter = moveNoButton;
        noBtn.ontouchstart = (e) => { e.preventDefault(); moveNoButton(e); };
        noBtn.onclick = (e) => { e.preventDefault(); moveNoButton(e); };

        yesBtn.onclick = () => {
          questionContainer.style.display = "none";
          noBtn.style.display = "none";
          heartLoader.style.display = "flex";

          setTimeout(() => {
            heartLoader.style.display = "none";
            resultContainer.style.display = "flex";

            if (gifResult && typeof gifResult.play === "function") {
              gifResult.play();
            }
          }, 2000);
        };
      })();
    </script>
</body>
</html>
